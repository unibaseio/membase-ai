name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv venv --python 3.12
      # CPU torch: the engine's sentence-transformers would otherwise pull the CUDA build.
      - run: uv pip install --torch-backend cpu -e '.[local]' --group dev
      - run: .venv/bin/ruff check membase tests
      - run: .venv/bin/pytest
  typescript:
    # npm workspaces: @unibaseio/membase (typescript/) and @unibaseio/membase-cli (cli/). The CLI
    # resolves the SDK from its build, so the SDK builds first.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm run build -w typescript
      - run: npm run typecheck --workspaces
      - run: npm test --workspaces
      - run: npm run build -w cli
