[project]
name = "membase-ai"
dynamic = ["version"]
description = "Membase — long-term memory for AI. One API for hosted and local memory, a CLI and an MCP server."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Unibase" }]
keywords = ["membase", "memory", "llm", "ai", "agents", "mcp"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]
dependencies = ["httpx>=0.25,<1"]

[project.optional-dependencies]
# Local memory: the membase-core engine under ~/.membase (Python 3.12+).
local = ["membase-core>=0.2.0; python_version >= '3.12'"]
# The engine's own extras, so one package name covers them: an Anthropic or Ollama model
# provider, and the multimodal parser (images, PDFs, web pages). Each implies `local`.
anthropic = ["membase-core[anthropic]>=0.2.0; python_version >= '3.12'"]
ollama = ["membase-core[ollama]>=0.2.0; python_version >= '3.12'"]
multimodal = ["membase-core[multimodal]>=0.2.0; python_version >= '3.12'"]
# `membase mcp`. mcp 2.x renamed mcp.server.fastmcp.
mcp = ["mcp>=1.0,<2"]
# The automem_* MCP tools also need membase-protocol, which is not on PyPI yet; install it from
# its repository next to this package.
dev = ["pytest>=8.2", "ruff==0.15.12", "mcp>=1.0,<2"]

[project.scripts]
membase = "membase.cli:main"

[project.urls]
Homepage = "https://membase.ai"
Repository = "https://github.com/unibaseio/membase-ai"

[build-system]
requires = ["hatchling<1.28"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "membase/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["membase"]

[tool.hatch.build.targets.sdist]
include = ["membase", "README.md", "LICENSE", "pyproject.toml"]

[tool.ruff]
line-length = 110

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
