[project]
name = "membase-mcp"
version = "0.2.0"
description = "MCP server for the Membase memory engine, with auto-memory backup on the Membase Protocol hub."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
keywords = ["mcp", "memory", "llm", "membase", "claude"]
dependencies = [
    # The engine, pinned; this server is its MCP interface.
    "unibase-supermem @ git+https://github.com/unibaseio/unibase-supermem.git@195658051095671c481d538d4807eea92c406c37",
    # mcp 2.x renamed mcp.server.fastmcp.
    "mcp>=1.0,<2",
]

[project.optional-dependencies]
# automem_* tools: signed, encrypted backup on the Membase Protocol hub.
protocol = [
    "unibase-membase-sdk @ git+https://github.com/unibaseio/membase-protocol.git@fd43dd7c0704a36274b7e8250400c42e6d80c58c",
]
dev = ["pytest>=8.2", "ruff==0.15.12"]

[project.scripts]
membase-mcp = "membase_mcp.cli:main"

[project.urls]
Repository = "https://github.com/unibaseio/membase-mcp"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/membase_mcp"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
