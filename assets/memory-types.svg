<svg xmlns="http://www.w3.org/2000/svg" width="840" height="268" viewBox="0 0 840 268" role="img" aria-label="Conversations, documents and agent traces"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8B949E"/></marker></defs><style>text{font-family:-apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;fill:#8B949E} .t{font-size:15px;font-weight:600;fill:#3E61FF} .h{font-size:15px;font-weight:700} .s{font-size:12.5px} .m{font-family:ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;font-size:12px} .w{fill:#FFFFFF} .k{fill:#2A3FBF}</style><text class="t" x="0" y="18">What the local engine makes of what you add</text><rect x="0" y="36" width="250" height="56" rx="12" fill="#3E61FF"/><text class="h w" x="125.0" y="69.0" text-anchor="middle">A conversation</text><line x1="254" y1="64" x2="352" y2="64" stroke="#8B949E" stroke-width="1.6" marker-end="url(#a)"/><rect x="356" y="36" width="250" height="56" rx="12" fill="#E3E8FF"/><text class="h k" x="481.0" y="69.0" text-anchor="middle">dated episodes</text><text class="s" x="626" y="69">one per topic, per speaker</text><rect x="0" y="108" width="250" height="56" rx="12" fill="#3E61FF"/><text class="h w" x="125.0" y="141.0" text-anchor="middle">A document</text><line x1="254" y1="136" x2="352" y2="136" stroke="#8B949E" stroke-width="1.6" marker-end="url(#a)"/><rect x="356" y="108" width="250" height="56" rx="12" fill="#E3E8FF"/><text class="h k" x="481.0" y="141.0" text-anchor="middle">a topic tree</text><text class="s" x="626" y="141">text, or a web page by url</text><rect x="0" y="180" width="250" height="56" rx="12" fill="#3E61FF"/><text class="h w" x="125.0" y="213.0" text-anchor="middle">An agent trace</text><line x1="254" y1="208" x2="352" y2="208" stroke="#8B949E" stroke-width="1.6" marker-end="url(#a)"/><rect x="356" y="180" width="250" height="56" rx="12" fill="#E3E8FF"/><text class="h k" x="481.0" y="213.0" text-anchor="middle">cases and skills</text><text class="s" x="626" y="213">membase agent ingest (local)</text><text class="s" x="0" y="260">search() returns episodes and document topics; membase --local agent search reads cases and skills.</text></svg>
