<svg xmlns="http://www.w3.org/2000/svg" width="840" height="86" viewBox="0 0 840 86" role="img" aria-label="Install, integrate, manage, retrieve"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8B949E"/></marker></defs><style>text{font-family:-apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;fill:#8B949E} .t{font-size:15px;font-weight:600;fill:#3E61FF} .h{font-size:15px;font-weight:700} .s{font-size:12.5px} .m{font-family:ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;font-size:12px} .w{fill:#FFFFFF} .k{fill:#2A3FBF}</style><rect x="0" y="8" width="186" height="70" rx="12" fill="#3E61FF"/><text class="h w" x="93.0" y="34" text-anchor="middle">1 · Install</text><text class="s w" x="93.0" y="54" text-anchor="middle">pip / npm install membase-ai</text><line x1="190" y1="43" x2="214" y2="43" stroke="#8B949E" stroke-width="1.6" marker-end="url(#a)"/><rect x="218" y="8" width="186" height="70" rx="12" fill="#E3E8FF"/><text class="h k" x="311.0" y="34" text-anchor="middle">2 · Integrate</text><text class="s k" x="311.0" y="54" text-anchor="middle">MCP, or the client in your code</text><line x1="408" y1="43" x2="432" y2="43" stroke="#8B949E" stroke-width="1.6" marker-end="url(#a)"/><rect x="436" y="8" width="186" height="70" rx="12" fill="#3E61FF"/><text class="h w" x="529.0" y="34" text-anchor="middle">3 · Manage</text><text class="s w" x="529.0" y="54" text-anchor="middle">web app or the membase CLI</text><line x1="626" y1="43" x2="650" y2="43" stroke="#8B949E" stroke-width="1.6" marker-end="url(#a)"/><rect x="654" y="8" width="186" height="70" rx="12" fill="#E3E8FF"/><text class="h k" x="747.0" y="34" text-anchor="middle">4 · Retrieve</text><text class="s k" x="747.0" y="54" text-anchor="middle">search() and ask() at runtime</text></svg>
