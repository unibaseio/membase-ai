<svg xmlns="http://www.w3.org/2000/svg" width="420" height="240" viewBox="0 0 420 240" role="img" aria-label="Claude Code reads the memory over MCP"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8B949E"/></marker></defs><style>text{font-family:-apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;fill:#8B949E} .t{font-size:15px;font-weight:600;fill:#3E61FF} .h{font-size:15px;font-weight:700} .s{font-size:12.5px} .m{font-family:ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;font-size:12px} .w{fill:#FFFFFF} .k{fill:#2A3FBF}</style><rect width="420" height="240" rx="14" fill="#151A30"/><circle cx="20" cy="20" r="5" fill="#FF5F57"/><circle cx="36" cy="20" r="5" fill="#FEBC2E"/><circle cx="52" cy="20" r="5" fill="#28C840"/><text x="210.0" y="24" text-anchor="middle" style="font-size:12px;fill:#8B93B5">Claude Code</text><text x="18" y="52" style="font-family:ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;font-size:12px;fill:#E6E9F5" xml:space="preserve">$ claude mcp add --transport http membase \</text><text x="18" y="69" style="font-family:ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;font-size:12px;fill:#E6E9F5" xml:space="preserve">    https://api.app.membase.io/mcp-http \</text><text x="18" y="86" style="font-family:ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;font-size:12px;fill:#E6E9F5" xml:space="preserve">    --header "Authorization: Bearer $KEY"</text><text x="18" y="103" style="font-family:ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;font-size:12px;fill:#7EE2A8" xml:space="preserve">Added HTTP MCP server membase with URL: …</text><text x="18" y="129" style="font-family:ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;font-size:12px;fill:#E6E9F5" xml:space="preserve">$ claude -p "Which database is the ledger on?"</text><text x="18" y="155" style="font-family:ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;font-size:12px;fill:#9DB0FF" xml:space="preserve">Postgres: you picked it for the ledger service,</text><text x="18" y="172" style="font-family:ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;font-size:12px;fill:#9DB0FF" xml:space="preserve">according to your Engineering memory.</text><text x="18" y="198" style="font-family:ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;font-size:12px;fill:#7C86B2" xml:space="preserve"># same memory your code and your assistant use</text></svg>
