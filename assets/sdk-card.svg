ce;font-size:12px;fill:#E6E9F5" xml:space="preserve">    print(hit["container_name"], hit["content"])</text><text x="18" y="181" style="font-family:ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;font-size:12px;fill:#9DB0FF" xml:space="preserve">Engineering  We picked Postgres for the ledger</text></svg>
